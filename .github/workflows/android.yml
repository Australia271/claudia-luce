name: Compila APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            export CL_KEYSTORE="$GITHUB_WORKSPACE/android/keystore/claudia.jks"
            export CL_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export CL_KEY_ALIAS=claudia
            export CL_KEY_PASSWORD="$KEYSTORE_PASSWORD"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Firma con la chiave di Claudia Luce"
          else
            echo "::warning::Manca il secret KEYSTORE_PASSWORD: APK firmato con una chiave temporanea"
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Pubblica l'APK (solo se firmato con la chiave stabile)
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Claudia Luce, ultima versione
          files: android/app/build/outputs/apk/release/app-release.apk
