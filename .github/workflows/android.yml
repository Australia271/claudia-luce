name: Compila APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Chiave di firma (se configurata nei Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/claudia.jks"
            echo "CL_KEYSTORE=$RUNNER_TEMP/claudia.jks" >> "$GITHUB_ENV"
          fi

      - name: Compila l'APK
        env:
          CL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Claudia Luce, ultima versione
          files: android/app/build/outputs/apk/release/app-release.apk
